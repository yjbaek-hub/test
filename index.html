<!doctype <!doctype html> <!-- 이 문서가 HTML5 문서임을 브라우저에 알려줍니다. -->

<html lang="ko"> <!-- HTML 문서의 시작이며, 문서의 기본 언어가 한국어임을 의미합니다. -->

<head> <!-- 화면에 직접 보이지 않는 문서 설정 정보를 넣는 영역입니다. -->

  <meta charset="utf-8"> <!-- 한글을 포함한 다양한 문자가 깨지지 않도록 UTF-8 인코딩을 사용합니다. -->

  <title>Hello New World</title> <!-- 브라우저 탭에 표시되는 페이지 제목입니다. -->

</head> <!-- head 영역의 끝입니다. -->

<body> <!-- 실제 웹페이지 화면에 표시되는 내용을 넣는 영역입니다. -->

  <h1>Hello World!</h1> <!-- 가장 큰 제목을 표시합니다. -->

  <h3>Jae Seung Lee</h3> <!-- h1보다 작은 크기의 제목을 표시합니다. -->
<p>I am a complete beginner at coding, but I will work hard and learn a lot this semester.</p>
</body> <!-- body 영역의 끝입니다. -->
